<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내집마련 트래커 — 로그인</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">

      <!-- 로고 -->
      <div class="auth-logo">
        <div class="logo-emoji">🏠</div>
        <div class="logo-title">내집마련 트래커</div>
        <div class="logo-desc">관심 아파트 시세를 직접 기록하고<br>스마트하게 내집마련을 준비하세요</div>
      </div>

      <!-- 에러 메시지 -->
      <div id="authAlert" class="alert alert-error hidden"></div>

      <!-- 탭 -->
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">로그인</div>
        <div class="auth-tab" data-tab="signup">회원가입</div>
      </div>

      <!-- 로그인 폼 -->
      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label class="form-label">이메일</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="example@email.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <div class="flex justify-between items-center" style="margin-bottom:7px">
            <label class="form-label" style="margin-bottom:0">비밀번호</label>
            <a href="#" class="forgot-link" id="forgotBtn">비밀번호 찾기</a>
          </div>
          <input type="password" id="loginPassword" class="form-input" placeholder="비밀번호 입력" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
          로그인
        </button>
      </form>

      <!-- 회원가입 폼 -->
      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label class="form-label">이름</label>
          <input type="text" id="signupName" class="form-input" placeholder="홍길동" autocomplete="name" required />
          <div id="nameError" class="form-error hidden">이름을 입력해주세요.</div>
        </div>
        <div class="form-group">
          <label class="form-label">이메일</label>
          <input type="email" id="signupEmail" class="form-input" placeholder="example@email.com" autocomplete="email" required />
          <div id="emailError" class="form-error hidden">올바른 이메일 형식을 입력해주세요.</div>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input type="password" id="signupPassword" class="form-input" placeholder="8자 이상, 영문+숫자+특수문자" autocomplete="new-password" required />
          <div id="pwError" class="form-error hidden">비밀번호는 8자 이상, 영문·숫자·특수문자를 포함해야 합니다.</div>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호 확인</label>
          <input type="password" id="signupPasswordConfirm" class="form-input" placeholder="비밀번호 재입력" autocomplete="new-password" required />
          <div id="pwConfirmError" class="form-error hidden">비밀번호가 일치하지 않습니다.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="signupBtn">
          회원가입
        </button>
      </form>

      <!-- 구분선 -->
      <div class="divider">또는</div>

      <!-- 구글 로그인 -->
      <button class="btn btn-google btn-full" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Google로 계속하기
      </button>

    </div>
  </div>

  <!-- 비밀번호 재설정 모달 -->
  <div class="modal-overlay" id="resetModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">비밀번호 재설정</span>
        <button class="modal-close" onclick="closeModal('resetModal')">✕</button>
      </div>
      <div class="modal-body">
        <p class="text-sm text-secondary mb-4">가입한 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">이메일</label>
          <input type="email" id="resetEmail" class="form-input" placeholder="example@email.com" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('resetModal')">취소</button>
        <button class="btn btn-primary" id="resetSubmitBtn">메일 발송</button>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script>
    // 이미 로그인된 경우 대시보드로 이동
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'dashboard.html';
    });

    // 탭 전환
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
        clearAlert();
      });
    });

    function showAlert(msg) {
      const el = document.getElementById('authAlert');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function clearAlert() {
      document.getElementById('authAlert').classList.add('hidden');
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? '처리 중...' : btn.id === 'loginBtn' ? '로그인' : '회원가입';
    }

    // 이메일 유효성
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // 비밀번호 유효성 (8자+, 영문+숫자+특수문자)
    function isValidPassword(pw) {
      return pw.length >= 8 && /[a-zA-Z]/.test(pw) && /[0-9]/.test(pw) && /[!@#$%^&*()_\-+=\[\]{};':"\\|,.<>\/?]/.test(pw);
    }

    // === 로그인 ===
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      clearAlert();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      setLoading('loginBtn', true);
      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        setLoading('loginBtn', false);
        const msgs = {
          'auth/user-not-found': '등록되지 않은 이메일입니다.',
          'auth/wrong-password': '비밀번호가 올바르지 않습니다.',
          'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
          'auth/too-many-requests': '너무 많은 시도로 일시 차단되었습니다. 잠시 후 다시 시도해주세요.',
          'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않습니다.',
        };
        showAlert(msgs[err.code] || '로그인에 실패했습니다. 다시 시도해주세요.');
      }
    });

    // === 회원가입 ===
    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault();
      clearAlert();
      let valid = true;
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const pw = document.getElementById('signupPassword').value;
      const pwConfirm = document.getElementById('signupPasswordConfirm').value;

      // 유효성 검사
      const show = (id, show) => document.getElementById(id).classList.toggle('hidden', !show);
      show('nameError', !name);
      show('emailError', !isValidEmail(email));
      show('pwError', !isValidPassword(pw));
      show('pwConfirmError', pw !== pwConfirm);
      if (!name || !isValidEmail(email) || !isValidPassword(pw) || pw !== pwConfirm) return;

      setLoading('signupBtn', true);
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pw);
        await cred.user.updateProfile({ displayName: name });
        // Firestore에 사용자 정보 저장
        await db.collection('users').doc(cred.user.uid).set({
          name, email, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        window.location.href = 'dashboard.html';
      } catch (err) {
        setLoading('signupBtn', false);
        const msgs = {
          'auth/email-already-in-use': '이미 사용 중인 이메일입니다.',
          'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
          'auth/weak-password': '비밀번호가 너무 약합니다.',
        };
        showAlert(msgs[err.code] || '회원가입에 실패했습니다.');
      }
    });

    // === Google 로그인 ===
    document.getElementById('googleBtn').addEventListener('click', async () => {
      clearAlert();
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const cred = await auth.signInWithPopup(provider);
        const user = cred.user;
        // 신규 가입이면 Firestore에 저장
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (!userDoc.exists) {
          await db.collection('users').doc(user.uid).set({
            name: user.displayName || '',
            email: user.email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') {
          showAlert('Google 로그인에 실패했습니다. 다시 시도해주세요.');
        }
      }
    });

    // === 비밀번호 찾기 ===
    document.getElementById('forgotBtn').addEventListener('click', e => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      if (email) document.getElementById('resetEmail').value = email;
      openModal('resetModal');
    });

    document.getElementById('resetSubmitBtn').addEventListener('click', async () => {
      const email = document.getElementById('resetEmail').value.trim();
      if (!email || !isValidEmail(email)) {
        showToast('올바른 이메일을 입력해주세요.', 'error');
        return;
      }
      try {
        await auth.sendPasswordResetEmail(email);
        closeModal('resetModal');
        showAlert('');
        document.getElementById('authAlert').className = 'alert alert-success';
        document.getElementById('authAlert').textContent = `${email}로 재설정 링크를 발송했습니다.`;
        document.getElementById('authAlert').classList.remove('hidden');
      } catch (err) {
        showToast('이메일 발송에 실패했습니다.', 'error');
      }
    });
  </script>
</body>
</html>
