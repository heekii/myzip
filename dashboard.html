<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대시보드 — 내집마련 트래커</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-layout">

    <!-- 사이드바 -->
    <aside class="sidebar" id="sidebar" aria-label="사이드바 메뉴">
      <a href="dashboard.html" class="sidebar-logo" aria-label="홈으로">
        <div class="logo-icon" aria-hidden="true">🏠</div>
        <div>
          <div class="logo-text">내집마련 트래커</div>
          <div class="logo-sub">부동산 시세 추적 서비스</div>
        </div>
      </a>
      <nav class="sidebar-nav" aria-label="사이드바 메뉴">
        <div class="nav-section-title">메뉴</div>
        <a href="dashboard.html" class="nav-item active">
          <span class="nav-icon">📊</span> 대시보드
        </a>
        <a href="compare.html" class="nav-item">
          <span class="nav-icon">📋</span> 단지 비교
        </a>
        <a href="apartment-register.html" class="nav-item">
          <span class="nav-icon">➕</span> 아파트 등록
        </a>
        <div class="nav-section-title" style="margin-top:12px">계정</div>
        <a href="profile.html" class="nav-item">
          <span class="nav-icon">👤</span> 프로필/설정
        </a>
        <button type="button" class="nav-item w-full" id="sidebarLogoutBtn" style="text-align:left">
          <span class="nav-icon">🚪</span> 로그아웃
        </button>
      </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 메인 컨텐츠 -->
    <div class="main-content">
      <!-- 헤더 -->
      <header class="top-header">
        <div class="header-left">
          <button type="button" class="hamburger" id="hamburger">☰</button>
          <span class="header-title">대시보드</span>
        </div>
        <div class="header-right">
          <div class="user-info">
            <div class="user-name" id="headerUserName">로딩 중...</div>
            <div class="user-email" id="headerUserEmail"></div>
          </div>
          <div class="user-avatar" id="headerAvatar">?</div>
        </div>
      </header>

      <!-- 페이지 컨텐츠 -->
      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" id="welcomeMsg">안녕하세요! 👋</h1>
            <p class="page-subtitle">등록한 아파트의 시세와 정보를 한눈에 확인하세요.</p>
          </div>
          <a href="apartment-register.html" class="btn btn-primary">
            <span>➕</span> 아파트 등록
          </a>
        </div>

        <!-- 통계 카드 -->
        <div class="grid-3 mb-6" id="statsRow">
          <div class="stat-card">
            <div class="stat-icon">🏢</div>
            <div class="stat-label">관심 단지</div>
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-change neutral">개 등록됨</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📈</div>
            <div class="stat-label">시세 상승</div>
            <div class="stat-value" id="statUp" style="color:var(--danger)">-</div>
            <div class="stat-change neutral">개 단지</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📉</div>
            <div class="stat-label">시세 하락</div>
            <div class="stat-value" id="statDown" style="color:var(--primary)">-</div>
            <div class="stat-change neutral">개 단지</div>
          </div>
        </div>

        <!-- 관심 아파트 목록 -->
        <div class="section-header">
          <h2 class="section-title">관심 아파트</h2>
          <a href="apartment-register.html" class="btn btn-secondary btn-sm">+ 추가</a>
        </div>

        <div id="aptListContainer">
          <!-- 로딩 스켈레톤 -->
          <div id="aptLoading" class="grid-3">
            <div class="apt-card" style="pointer-events:none">
              <div style="background:var(--bg);border-radius:6px;height:18px;width:60%;margin-bottom:8px"></div>
              <div style="background:var(--bg);border-radius:6px;height:14px;width:80%"></div>
              <div class="apt-price-row mt-3">
                <div style="background:var(--bg);border-radius:6px;height:16px;flex:1"></div>
                <div style="background:var(--bg);border-radius:6px;height:16px;flex:1"></div>
              </div>
            </div>
            <div class="apt-card" style="pointer-events:none">
              <div style="background:var(--bg);border-radius:6px;height:18px;width:50%;margin-bottom:8px"></div>
              <div style="background:var(--bg);border-radius:6px;height:14px;width:70%"></div>
            </div>
          </div>
          <!-- 실제 목록 -->
          <div id="aptGrid" class="grid-3 hidden"></div>
          <!-- 빈 상태 -->
          <div id="aptEmpty" class="empty-state hidden">
            <div class="empty-icon">🏢</div>
            <div class="empty-title">등록된 아파트가 없습니다</div>
            <div class="empty-desc">관심 있는 아파트를 등록하고<br>시세 변화를 직접 추적해보세요.</div>
            <a href="apartment-register.html" class="btn btn-primary">첫 아파트 등록하기</a>
          </div>
        </div>


      </main>
    </div>

    <!-- 모바일 하단 내비게이션 -->
    <nav class="bottom-nav" aria-label="하단 내비게이션">
      <ul class="bottom-nav-list">
        <li><a href="dashboard.html" class="bottom-nav-item active"><span class="nav-icon">📊</span>대시보드</a></li>
        <li><a href="compare.html" class="bottom-nav-item"><span class="nav-icon">📋</span>비교</a></li>
        <li><a href="apartment-register.html" class="bottom-nav-item"><span class="nav-icon">➕</span>등록</a></li>
        <li><a href="profile.html" class="bottom-nav-item"><span class="nav-icon">👤</span>프로필</a></li>
      </ul>
    </nav>
  </div>

  <!-- 로딩 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">로딩 중...</div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script>
    let currentUser = null;
    let apartments = [];

    requireAuth(async (user) => {
      if (!user) {
        initSidebar();
        showGuestBanner('게스트 모드입니다. 지금 입력한 데이터는 탭을 닫으면 사라져요. 영구 저장하려면 로그인하세요.');
        document.getElementById('welcomeMsg').textContent = '내집마련 트래커에 오신 걸 환영해요! 👋';
        document.getElementById('headerUserName').textContent = '게스트';
        document.getElementById('headerUserEmail').textContent = '';
        document.getElementById('headerAvatar').textContent = '?';
        loadGuestDashboard();
        return;
      }
      currentUser = user;
      initSidebar();
      renderUserInfo(user);
      await loadDashboard();
    }, { allowGuest: true });

    function loadGuestDashboard() {
      apartments = guestDB.getApartments();
      document.getElementById('statTotal').textContent = apartments.length;
      document.getElementById('aptLoading').classList.add('hidden');
      if (apartments.length === 0) {
        document.getElementById('aptEmpty').classList.remove('hidden');
      } else {
        renderApartments();
        loadStats();
      }
    }

    function renderUserInfo(user) {
      const name = user.displayName || user.email.split('@')[0];
      document.getElementById('headerUserName').textContent = name;
      document.getElementById('headerUserEmail').textContent = user.email;
      document.getElementById('headerAvatar').textContent = getInitial(user.displayName, user.email);
      document.getElementById('welcomeMsg').textContent = `${name}님, 안녕하세요! 👋`;
    }

    async function loadDashboard() {
      try {
        const snap = await db.collection('apartments')
          .where('userId', '==', currentUser.uid)
          .get();
        apartments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        apartments.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        document.getElementById('statTotal').textContent = apartments.length;
        renderApartments();
        loadStats();
      } catch (err) {
        console.error(err);
        document.getElementById('aptLoading').classList.add('hidden');
        document.getElementById('aptEmpty').classList.remove('hidden');
      }
    }

    function renderApartments() {
      document.getElementById('aptLoading').classList.add('hidden');
      const grid = document.getElementById('aptGrid');
      const empty = document.getElementById('aptEmpty');

      if (apartments.length === 0) {
        empty.classList.remove('hidden');
        return;
      }

      grid.classList.remove('hidden');
      grid.innerHTML = apartments.map(apt => {
        const latestPrice = apt.latestMaxPrice ? formatPrice(apt.latestMaxPrice) : '미입력';
        const prevPrice = apt.prevMaxPrice;
        const tags = [];
        if (apt.completionYear) tags.push(`${apt.completionYear}년 준공`);
        if (apt.totalUnits) tags.push(`${Number(apt.totalUnits).toLocaleString()}세대`);

        return `
          <a href="apartment-detail.html?id=${apt.id}" class="apt-card">
            <div class="apt-card-header">
              <div>
                <div class="apt-name">${apt.name}</div>
                <div class="apt-address">${apt.address || apt.region || ''}</div>
              </div>
              ${changeBadge(prevPrice, apt.latestMaxPrice)}
            </div>
            ${tags.length ? `<div class="apt-meta">${tags.map(t => `<span class="apt-tag">${t}</span>`).join('')}</div>` : ''}
            <div class="apt-price-row">
              <div class="apt-price-item">
                <div class="apt-price-label">최근 최고가</div>
                <div class="apt-price-value">${latestPrice}</div>
              </div>
              <div class="apt-price-item">
                <div class="apt-price-label">최근 최저가</div>
                <div class="apt-price-value">${apt.latestMinPrice ? formatPrice(apt.latestMinPrice) : '미입력'}</div>
              </div>
              <div class="apt-price-item">
                <div class="apt-price-label">기록 수</div>
                <div class="apt-price-value">${apt.priceCount || 0}건</div>
              </div>
            </div>
          </a>`;
      }).join('');
    }

    function loadStats() {
      let upCount = 0, downCount = 0;
      apartments.forEach(apt => {
        const latest = apt.latestMaxPrice;
        const prev = apt.prevMaxPrice;
        if (latest != null && prev != null) {
          if (latest > prev) upCount++;
          else if (latest < prev) downCount++;
        }
      });
      document.getElementById('statUp').textContent = upCount;
      document.getElementById('statDown').textContent = downCount;
    }

    document.getElementById('sidebarLogoutBtn').addEventListener('click', async () => {
      if (confirm('로그아웃 하시겠습니까?')) {
        await auth.signOut();
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
