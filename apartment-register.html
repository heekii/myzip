<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아파트 등록 — 내집마련 트래커</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=cc53b3da1664f19204dfe8ea42536825&libraries=services"></script>
</head>
<body>
  <div class="app-layout">

    <!-- 사이드바 -->
    <aside class="sidebar" id="sidebar" aria-label="사이드바 메뉴">
      <a href="dashboard.html" class="sidebar-logo" aria-label="홈으로">
        <div class="logo-icon" aria-hidden="true">🏠</div>
        <div>
          <div class="logo-text">내집마련 트래커</div>
          <div class="logo-sub">부동산 시세 추적 서비스</div>
        </div>
      </a>
      <nav class="sidebar-nav" aria-label="사이드바 메뉴">
        <div class="nav-section-title">메뉴</div>
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> 대시보드</a>
        <a href="compare.html" class="nav-item"><span class="nav-icon">📋</span> 단지 비교</a>
        <a href="apartment-register.html" class="nav-item active"><span class="nav-icon">➕</span> 아파트 등록</a>
        <div class="nav-section-title" style="margin-top:12px">계정</div>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span> 프로필/설정</a>
        <button type="button" class="nav-item w-full" id="sidebarLogoutBtn" style="text-align:left">
          <span class="nav-icon">🚪</span> 로그아웃
        </button>
      </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button type="button" class="hamburger" id="hamburger">☰</button>
          <span class="header-title">아파트 등록</span>
        </div>
      </header>

      <main class="page-content" style="max-width:680px">
        <div class="page-header">
          <div>
            <h1 class="page-title">아파트 추가</h1>
            <p class="page-subtitle">이름만 검색하면 끝이에요. 상세 정보는 나중에 채울 수 있어요.</p>
          </div>
        </div>

        <!-- 단일 등록 카드 -->
        <div class="card" style="max-width:560px;margin:0 auto">
          <div class="card-body">
            <!-- 아파트 검색 -->
            <div class="form-group" style="position:relative;margin-bottom:12px">
              <label class="form-label" for="aptName">아파트 단지명</label>
              <input type="text" id="aptName" class="form-input" placeholder="예: 래미안원베일리" maxlength="50" autocomplete="off"
                style="font-size:1rem;padding:14px 16px;border-radius:12px" />
              <div id="aptNameDropdown" style="display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--primary);border-radius:12px;box-shadow:0 8px 24px rgba(37,99,235,.15);z-index:100;max-height:360px;overflow-y:auto"></div>
              <div class="form-hint" style="margin-top:6px">이름 입력 → 목록에서 선택하면 주소·세대수·준공연도가 자동 입력돼요</div>
            </div>

            <!-- 자동입력 결과 (선택 후 표시) -->
            <div id="aptPreview" style="display:none;background:var(--bg);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:0.875rem">
              <div style="font-weight:700;margin-bottom:4px" id="previewName"></div>
              <div style="color:var(--text-muted)" id="previewAddress"></div>
              <div style="color:var(--text-muted);margin-top:4px;font-size:0.8rem" id="previewMeta"></div>
            </div>

            <input type="hidden" id="aptAddress" />
            <input type="hidden" id="aptRegion" />
            <input type="hidden" id="aptLawdCd" />
            <input type="hidden" id="aptYear" />
            <input type="hidden" id="aptUnits" />
            <input type="hidden" id="aptMaxFloor" />
            <input type="hidden" id="aptLat" />
            <input type="hidden" id="aptLng" />
            <input type="hidden" id="aptCommute_gangnam" />
            <input type="hidden" id="aptCommute_yeouido" />
            <input type="hidden" id="aptCommute_jongno" />

            <button type="button" class="btn btn-primary btn-full" id="registerBtn"
              style="padding:14px;font-size:1rem;border-radius:12px;margin-top:4px">
              추가하기
            </button>
            <p class="text-center text-xs" style="color:var(--text-muted);margin-top:10px">
              주소 자동검색이 안 되면 <button type="button" class="forgot-link" onclick="searchAddress()" style="font-size:inherit">주소 직접 검색</button>
            </p>
          </div>
        </div>

      </main>
    </div>

    <nav class="bottom-nav" aria-label="하단 내비게이션">
      <ul class="bottom-nav-list">
        <li><a href="dashboard.html" class="bottom-nav-item"><span class="nav-icon">📊</span>대시보드</a></li>
        <li><a href="compare.html" class="bottom-nav-item"><span class="nav-icon">📋</span>비교</a></li>
        <li><a href="apartment-register.html" class="bottom-nav-item active"><span class="nav-icon">➕</span>등록</a></li>
        <li><a href="profile.html" class="bottom-nav-item"><span class="nav-icon">👤</span>프로필</a></li>
      </ul>
    </nav>
  </div>

  <!-- 게스트 로그인 유도 모달 -->
  <div class="modal-overlay" id="guestModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">로그인이 필요해요</span>
        <button type="button" class="modal-close" onclick="closeModal('guestModal')" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">
        <p class="text-sm text-secondary mb-4">아파트를 저장하려면 계정이 필요해요.<br>지금 가입하면 무료로 시세를 추적할 수 있어요!</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('guestModal')">계속 둘러보기</button>
        <a href="index.html#signup" class="btn btn-primary">회원가입하기</a>
      </div>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">등록 중...</div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script>
    const MOLIT_API_KEY = '90072a18f3a77423afbb4652e22f161c810ae15acc14654ea0ea3ec276ca4fce';
    const ODSAY_KEY = '5QCQZr+fdJhD2Blcte1aWA';
    const STATIONS = {
      gangnam: { name: '강남역',   lng: 127.027621, lat: 37.497942 },
      yeouido: { name: '여의도역',  lng: 126.924171, lat: 37.521574 },
      jongno:  { name: '종로3가역', lng: 126.991854, lat: 37.571607 }
    };
    let currentUser = null;
    let nameSearchTimer = null;
    let ps = null;
    let geocoder = null;
    try {
      ps = new kakao.maps.services.Places();
      geocoder = new kakao.maps.services.Geocoder();
    } catch(e) {
      console.warn('Kakao Maps SDK 로드 실패:', e.message);
    }

    requireAuth(user => {
      currentUser = user;
      initSidebar();
      if (!user) showGuestBanner('게스트 모드입니다. 작성은 가능하지만 저장하려면 로그인이 필요해요.');
    }, { allowGuest: true });

    // 등록
    document.getElementById('registerBtn').addEventListener('click', async () => {
      const name = document.getElementById('aptName').value.trim();
      const address = document.getElementById('aptAddress').value.trim();
      if (!name) { showToast('아파트 이름을 입력해주세요.', 'error'); return; }
      if (!address) { showToast('목록에서 아파트를 선택하거나 주소를 직접 검색해주세요.', 'error'); return; }

      showLoading();
      try {
        // 게스트 모드: sessionStorage에 저장
        if (!currentUser) {
          const aptData = {
            name, address,
            region: document.getElementById('aptRegion').value.trim(),
            lawdCd: document.getElementById('aptLawdCd').value || null,
            completionYear: document.getElementById('aptYear').value || null,
            totalUnits: document.getElementById('aptUnits').value || null,
            maxFloor: document.getElementById('aptMaxFloor').value || null,
            lat: parseFloat(document.getElementById('aptLat').value) || null,
            lng: parseFloat(document.getElementById('aptLng').value) || null,
          };
          const aptId = guestDB.addApartment(aptData);
          const commuteData = {
            commuteGangnam: document.getElementById('aptCommute_gangnam').value || null,
            commuteYeouido: document.getElementById('aptCommute_yeouido').value || null,
            commuteJongno:  document.getElementById('aptCommute_jongno').value  || null,
          };
          guestDB.setInfo(aptId, commuteData);
          hideLoading();
          window.location.href = `apartment-detail.html?id=${aptId}`;
          return;
        }

        const dup = await db.collection('apartments')
          .where('userId', '==', currentUser.uid)
          .where('name', '==', name)
          .get();
        if (!dup.empty) { hideLoading(); showToast('이미 등록된 아파트입니다.', 'error'); return; }

        const ref = await db.collection('apartments').add({
          userId: currentUser.uid,
          name, address,
          region: document.getElementById('aptRegion').value.trim(),
          lawdCd: document.getElementById('aptLawdCd').value || null,
          completionYear: document.getElementById('aptYear').value || null,
          totalUnits: document.getElementById('aptUnits').value || null,
          maxFloor: document.getElementById('aptMaxFloor').value || null,
          lat: parseFloat(document.getElementById('aptLat').value) || null,
          lng: parseFloat(document.getElementById('aptLng').value) || null,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          priceCount: 0
        });

        await db.collection('apartments').doc(ref.id).collection('info').doc('detail').set({
          commuteGangnam: document.getElementById('aptCommute_gangnam').value || null,
          commuteYeouido: document.getElementById('aptCommute_yeouido').value || null,
          commuteJongno:  document.getElementById('aptCommute_jongno').value  || null,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        hideLoading();
        window.location.href = `apartment-detail.html?id=${ref.id}`;
      } catch (err) {
        hideLoading();
        console.error(err);
        showToast('등록 중 오류가 발생했습니다.', 'error');
      }
    });

    // 검색 입력
    document.getElementById('aptName').addEventListener('input', function() {
      clearTimeout(nameSearchTimer);
      const q = this.value.trim();
      const dropdown = document.getElementById('aptNameDropdown');
      if (q.length < 2) { dropdown.style.display = 'none'; return; }
      nameSearchTimer = setTimeout(() => searchApartmentName(q), 300);
    });

    document.getElementById('aptName').addEventListener('blur', () => {
      setTimeout(() => { document.getElementById('aptNameDropdown').style.display = 'none'; }, 200);
    });

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function highlightText(text, query) {
      const idx = text.toLowerCase().indexOf(query.toLowerCase());
      if (idx === -1) return escHtml(text);
      return escHtml(text.slice(0, idx)) +
        `<mark style="background:none;color:var(--primary);font-weight:700">${escHtml(text.slice(idx, idx + query.length))}</mark>` +
        escHtml(text.slice(idx + query.length));
    }

    function searchApartmentName(q) {
      const dropdown = document.getElementById('aptNameDropdown');
      if (!ps) {
        dropdown.innerHTML = '<div style="padding:12px 16px;font-size:13px;color:var(--text-muted)">검색 불가 — 아래 주소 직접 검색을 이용해주세요</div>';
        dropdown.style.display = 'block';
        return;
      }
      dropdown.innerHTML = '<div style="padding:12px 16px;font-size:13px;color:var(--text-muted)">검색 중...</div>';
      dropdown.style.display = 'block';

      ps.keywordSearch(q, (result, status) => {
        if (status !== kakao.maps.services.Status.OK) {
          dropdown.innerHTML = '<div style="padding:12px 16px;font-size:13px;color:var(--text-muted)">결과가 없습니다</div>';
          return;
        }
        const places = result.filter(p => p.category_name?.endsWith('아파트'));
        if (!places.length) {
          dropdown.innerHTML = '<div style="padding:12px 16px;font-size:13px;color:var(--text-muted)">아파트 결과가 없습니다</div>';
          return;
        }

        dropdown.innerHTML = places.map(p => {
          const cleanName = p.place_name.replace(/아파트$/, '').trim();
          const addr = p.road_address_name || p.address_name;
          return `<div class="apt-suggest-item"
            data-name="${escHtml(cleanName)}"
            data-address="${escHtml(addr)}">
            <div class="suggest-name">${highlightText(cleanName, q)}</div>
            <div class="suggest-addr">${escHtml(addr)}</div>
          </div>`;
        }).join('');

        dropdown.querySelectorAll('.apt-suggest-item').forEach(el => {
          el.addEventListener('mousedown', () => selectApartment(el.dataset.name, el.dataset.address));
        });
      }, { size: 15 });
    }

    function showPreview(name, address, meta) {
      document.getElementById('previewName').textContent = name;
      document.getElementById('previewAddress').textContent = address;
      document.getElementById('previewMeta').textContent = meta;
      document.getElementById('aptPreview').style.display = 'block';
    }

    function selectApartment(name, address) {
      document.getElementById('aptName').value = name;
      document.getElementById('aptAddress').value = address;
      document.getElementById('aptNameDropdown').style.display = 'none';
      showPreview(name, address, '정보 불러오는 중...');

      geocoder.addressSearch(address, async (result, status) => {
        if (status === kakao.maps.services.Status.OK && result[0]?.address) {
          const addr = result[0].address;
          const sido = addr.region_1depth_name || '';
          const sigungu = addr.region_2depth_name || '';
          document.getElementById('aptRegion').value = `${sido} ${sigungu}`.trim();
          // 좌표 저장 (단지비교 활용)
          document.getElementById('aptLat').value = result[0].y || '';
          document.getElementById('aptLng').value = result[0].x || '';
          const bCode = addr.b_code || '';
          if (bCode) {
            document.getElementById('aptLawdCd').value = bCode.substring(0, 5);
            const lat = parseFloat(result[0].y);
            const lng = parseFloat(result[0].x);
            await Promise.all([
              fetchAptDetailFromMOLIT(name, bCode.substring(0, 5)),
              tryFetchAptUnits(name, bCode),
              fetchCommuteTimes(lat, lng)
            ]);
            return;
          }
        }
        showPreview(name, address, '');
      });
    }

    async function fetchAptDetailFromMOLIT(aptName, lawdCd) {
      const norm = s => s.replace(/[\s()（）아파트]/g, '').toLowerCase();
      const normName = norm(aptName);
      const now = new Date();

      // 최근 6개월 병렬 호출 → 모아서 최고층 계산
      const months = Array.from({length: 6}, (_, i) => {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        return String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, '0');
      });

      const results = await Promise.all(months.map(ym =>
        fetch(`https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev?serviceKey=${encodeURIComponent(MOLIT_API_KEY)}&LAWD_CD=${lawdCd}&DEAL_YMD=${ym}&numOfRows=1000&_type=json`)
          .then(r => r.json())
          .then(data => {
            let items = data.response?.body?.items?.item || [];
            if (!Array.isArray(items)) items = items ? [items] : [];
            return items.filter(it => { const n = norm(it.aptNm||''); return n===normName||n.includes(normName)||normName.includes(n); });
          })
          .catch(() => [])
      ));

      const allMatched = results.flat();
      if (allMatched.length > 0) {
        const buildYear = allMatched[0].buildYear;
        const metaParts = [];
        if (buildYear) { document.getElementById('aptYear').value = buildYear; metaParts.push(`${buildYear}년 준공`); }
        showPreview(aptName, document.getElementById('aptAddress').value, metaParts.join(' · '));
      } else {
        showPreview(aptName, document.getElementById('aptAddress').value, '');
      }
    }

    async function tryFetchAptUnits(aptName, bCode) {
      const norm = s => s.replace(/[\s()（）아파트]/g, '').toLowerCase();
      const normName = norm(aptName);
      try {
        // AptListService2로 법정동 코드 기반 아파트 목록 조회 → kaptCode 확보
        const listUrl = `https://apis.data.go.kr/1613000/AptListService2/getAptList?serviceKey=${encodeURIComponent(MOLIT_API_KEY)}&bjdongCode=${bCode}&numOfRows=200&_type=json`;
        const listRes = await fetch(listUrl);
        const listData = await listRes.json();
        let items = listData.response?.body?.items?.item || [];
        if (!Array.isArray(items)) items = items ? [items] : [];
        const match = items.find(it => {
          const n = norm(it.kaptName || '');
          return n === normName || n.includes(normName) || normName.includes(n);
        });
        if (!match?.kaptCode) return;
        // kaptCode로 세대수 조회
        const infoUrl = `https://apis.data.go.kr/1613000/AptBasisInfoService/getAprtInfo?serviceKey=${encodeURIComponent(MOLIT_API_KEY)}&kaptCode=${match.kaptCode}&_type=json`;
        const infoRes = await fetch(infoUrl);
        const infoData = await infoRes.json();
        const info = infoData.response?.body?.items?.item;
        if (!info) return;
        const units = info.kaptHoCount;
        if (units) {
          document.getElementById('aptUnits').value = units;
          // 이미 보여주는 미리보기에 세대수 반영
          const metaEl = document.getElementById('previewMeta');
          if (metaEl && metaEl.textContent) {
            metaEl.textContent = metaEl.textContent + ` · ${Number(units).toLocaleString()}세대`;
          }
        }
      } catch(e) {
        // 세대수 API 실패 시 무시 (수기 입력)
      }
    }

    async function fetchCommuteTimes(fromLat, fromLng) {
      const entries = await Promise.all(
        Object.entries(STATIONS).map(async ([key, station]) => {
          try {
            const url = `https://api.odsay.com/v1/api/searchPubTransPathR?apiKey=${encodeURIComponent(ODSAY_KEY)}&SX=${fromLng}&SY=${fromLat}&EX=${station.lng}&EY=${station.lat}&SearchType=0`;
            const res = await fetch(url);
            const data = await res.json();
            const mins = data.result?.path?.[0]?.info?.totalTime;
            return [key, mins != null ? `${mins}분` : null];
          } catch(e) {
            return [key, null];
          }
        })
      );

      const commuteTexts = [];
      entries.forEach(([key, time]) => {
        if (!time) return;
        document.getElementById(`aptCommute_${key}`).value = time;
        commuteTexts.push(`${STATIONS[key].name} ${time}`);
      });

      if (commuteTexts.length > 0) {
        const metaEl = document.getElementById('previewMeta');
        if (metaEl) {
          const existing = metaEl.textContent;
          metaEl.textContent = existing ? `${existing} · ${commuteTexts.join(' · ')}` : commuteTexts.join(' · ');
        }
      }
    }

    function searchAddress() {
      new daum.Postcode({
        oncomplete(data) {
          const address = data.roadAddress || data.jibunAddress;
          document.getElementById('aptAddress').value = address;
          document.getElementById('aptRegion').value = `${data.sido} ${data.sigungu}`.trim();
          document.getElementById('aptLawdCd').value = data.sigunguCode;
          showPreview(document.getElementById('aptName').value.trim() || address, address, '');
        }
      }).open();
    }

    document.getElementById('sidebarLogoutBtn').addEventListener('click', async () => {
      if (confirm('로그아웃 하시겠습니까?')) {
        await auth.signOut();
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
